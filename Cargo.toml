[workspace]
members = [
  "crates/sidekick-core",
  "crates/sidekick-ui",
  "crates/sidekick-app",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Screen Sidekick contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = { version = "0.9.8", features = ["image", "wgc"] }
arboard = "3.6.1"
global-hotkey = "0.8.0"
tray-icon = "0.24.2"
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
core-graphics = "0.25"

# Pin GPUI to a known Zed revision so macOS + Windows use the same API surface.
gpui = { git = "https://github.com/zed-industries/zed", rev = "d9ad6aff67e47de43abb270d22de75dd950f1b48", package = "gpui", default-features = false, features = ["font-kit", "windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d9ad6aff67e47de43abb270d22de75dd950f1b48", package = "gpui_platform", default-features = false, features = ["font-kit"] }
